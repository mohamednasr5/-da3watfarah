<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول | دعوة فرح</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0B0F0E;--panel:#152420;--gold:#C9A227;--gold-light:#E8C766;--text:#F5F1E8;--text-dim:#A9B3AC;--line:rgba(201,162,39,.25)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 20% 10%,rgba(201,162,39,.08),transparent 40%),var(--bg);
    font-family:'Cairo',sans-serif;color:var(--text);padding:20px;
  }
  .card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:38px 30px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
  .logo{font-family:'Amiri',serif;font-size:24px;color:var(--gold-light);text-align:center;margin-bottom:6px}
  .sub{text-align:center;color:var(--text-dim);font-size:14px;margin-bottom:28px}
  .tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:24px;border:1px solid var(--line)}
  .tabs button{flex:1;background:none;border:none;color:var(--text-dim);padding:10px;border-radius:9px;font-family:'Cairo';font-weight:700;font-size:14px;cursor:pointer;transition:.2s}
  .tabs button.active{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#12210F}
  label{display:block;font-size:13px;color:var(--text-dim);margin:14px 0 6px}
  input{
    width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);font-family:'Cairo';font-size:14px;outline:none;
  }
  input:focus{border-color:var(--gold)}
  .btn{
    width:100%;margin-top:24px;padding:14px;border-radius:999px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#12210F;
    font-family:'Cairo';font-weight:900;font-size:15px;transition:.2s;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px}
  .msg.error{color:#E88}
  .msg.ok{color:#8CE0A0}
  .back{display:block;text-align:center;margin-top:22px;color:var(--text-dim);font-size:13px;text-decoration:none}
  .back:hover{color:var(--gold-light)}
  .hint{font-size:12px;color:var(--text-dim);margin-top:6px}
  .divider{display:flex;align-items:center;gap:12px;margin:22px 0 4px;color:var(--text-dim);font-size:12.5px}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
  .btn-google{
    width:100%;margin-top:16px;padding:13px;border-radius:999px;cursor:pointer;
    background:#fff;color:#3c3c3c;border:1px solid var(--line);
    font-family:'Cairo';font-weight:700;font-size:14px;
    display:flex;align-items:center;justify-content:center;gap:10px;transition:.2s;
  }
  .btn-google:hover{filter:brightness(.97)}
  .btn-google svg{width:18px;height:18px}
</style>
</head>
<body>

<div class="card">
  <div class="logo">دعوة فرح</div>
  <div class="sub">حساب العريس والعروسة لإدارة دعوتكم</div>

  <div class="tabs">
    <button id="tabLogin" class="active">تسجيل الدخول</button>
    <button id="tabSignup">إنشاء حساب</button>
  </div>

  <form id="loginForm">
    <label>البريد الإلكتروني</label>
    <input type="email" id="loginEmail" required placeholder="example@email.com">
    <label>كلمة المرور</label>
    <input type="password" id="loginPassword" required placeholder="••••••••">
    <button class="btn" type="submit">دخول</button>
  </form>

  <form id="signupForm" style="display:none">
    <label>اسم العريس</label>
    <input type="text" id="groomName" required placeholder="مثال: محمد">
    <label>اسم العروسة</label>
    <input type="text" id="brideName" required placeholder="مثال: منى">
    <label>البريد الإلكتروني</label>
    <input type="email" id="signupEmail" required placeholder="example@email.com">
    <label>كلمة المرور</label>
    <input type="password" id="signupPassword" required minlength="6" placeholder="٦ أحرف على الأقل">
    <div class="hint">رابط دعوتكم هيتحدد تلقائيًا من الأسماء، وتقدروا تغيروه بعدين من لوحة التحكم.</div>
    <button class="btn" type="submit">إنشاء الحساب والدعوة</button>
  </form>

  <form id="googleNamesForm" style="display:none">
    <div class="hint" style="margin-bottom:10px">أول مرة تدخلوا بحساب جوجل — اكتبوا أسماءكم عشان نجهّز رابط دعوتكم:</div>
    <label>اسم العريس</label>
    <input type="text" id="gGroomName" required placeholder="مثال: محمد">
    <label>اسم العروسة</label>
    <input type="text" id="gBrideName" required placeholder="مثال: منى">
    <button class="btn" type="submit">إنشاء دعوتي</button>
  </form>

  <div class="divider" id="googleDivider">أو</div>
  <button type="button" class="btn-google" id="googleBtn">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.9 19 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3c-7.4 0-13.8 4.1-17.1 10.1z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 36.5 26.9 37.5 24 37.5c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.9 40.5 16.4 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.7l6.6 5.4C41.4 35.6 45 30.3 45 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
    <span id="googleBtnText">الدخول بحساب جوجل</span>
  </button>

  <div class="msg" id="msg"></div>
  <a href="index.html" class="back">الرجوع للرئيسية</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    onAuthStateChanged, GoogleAuthProvider, signInWithPopup
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getDatabase, ref, set, get
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // ===== إعدادات فايربيز — استبدل بالقيم الخاصة بمشروعك =====
  const firebaseConfig = {
    apiKey: "AIzaSyAIyJ_oZdA1VGDMfKwCUfQwdO5ZOoQy2DQ",
    authDomain: "da3watfarah.firebaseapp.com",
    databaseURL: "https://da3watfarah-default-rtdb.firebaseio.com",
    projectId: "da3watfarah",
    storageBucket: "da3watfarah.firebasestorage.app",
    messagingSenderId: "818147201311",
    appId: "1:818147201311:web:cb83942913bc2d6a86e02a",
    measurementId: "G-J9D7R961V7"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const tabLogin = document.getElementById('tabLogin');
  const tabSignup = document.getElementById('tabSignup');
  const loginForm = document.getElementById('loginForm');
  const signupForm = document.getElementById('signupForm');
  const msg = document.getElementById('msg');

  function showTab(tab){
    const isLogin = tab === 'login';
    tabLogin.classList.toggle('active', isLogin);
    tabSignup.classList.toggle('active', !isLogin);
    loginForm.style.display = isLogin ? 'block' : 'none';
    signupForm.style.display = isLogin ? 'none' : 'block';
    msg.textContent = '';
  }
  tabLogin.addEventListener('click', () => showTab('login'));
  tabSignup.addEventListener('click', () => showTab('signup'));
  const qs = new URLSearchParams(location.search);
  if (qs.get('mode') === 'signup') showTab('signup');
  const presetTheme = ['royal','blossom','modern','rosegold','lavender','emerald','sunset','garden'].includes(qs.get('theme')) ? qs.get('theme') : 'royal';

  function setMsg(text, type){
    msg.textContent = text;
    msg.className = 'msg ' + (type || '');
  }

  function slugify(groom, bride){
    const clean = s => s.trim().replace(/\s+/g,'');
    return `${clean(groom)}&${clean(bride)}`;
  }

  async function uniqueSlug(base){
    let slug = base, i = 2;
    while (true) {
      const snap = await get(ref(db, 'invitations/' + encodeURIComponent(slug)));
      if (!snap.exists()) return slug;
      slug = `${base}${i}`; i++;
    }
  }

  let awaitingGoogleNames = false;

  onAuthStateChanged(auth, async (user) => {
    if (!user || awaitingGoogleNames) return;
    const userSnap = await get(ref(db, 'users/' + user.uid));
    if (userSnap.exists()) {
      window.location.href = 'editor.html';
    }
    // مستخدم مسجّل بجوجل لأول مرة ولسه معندوش سجل — هيتعرض له نموذج الأسماء عند الضغط على زر جوجل
  });

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    setMsg('جاري تسجيل الدخول...', '');
    try {
      await signInWithEmailAndPassword(auth,
        document.getElementById('loginEmail').value,
        document.getElementById('loginPassword').value
      );
      setMsg('تم تسجيل الدخول بنجاح', 'ok');
    } catch (err) {
      setMsg('البريد أو كلمة المرور غير صحيحة', 'error');
    }
  });

  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const groom = document.getElementById('groomName').value;
    const bride = document.getElementById('brideName').value;
    const email = document.getElementById('signupEmail').value;
    const password = document.getElementById('signupPassword').value;

    setMsg('جاري إنشاء دعوتكم...', '');
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      const baseSlug = slugify(groom, bride);
      const slug = await uniqueSlug(baseSlug);

      await set(ref(db, 'users/' + cred.user.uid), {
        email, slug, role: 'couple', createdAt: Date.now()
      });

      await set(ref(db, 'invitations/' + slug), {
        ownerUid: cred.user.uid,
        groomName: groom,
        brideName: bride,
        eventType: 'wedding',
        theme: presetTheme,
        published: false,
        views: 0,
        createdAt: Date.now()
      });

      setMsg('تم إنشاء الحساب! رابط دعوتكم: da3watfarah.com/' + slug, 'ok');
    } catch (err) {
      setMsg(err.code === 'auth/email-already-in-use' ? 'البريد مستخدم بالفعل' : 'حدث خطأ، حاول مرة أخرى', 'error');
    }
  });

  // ===== تسجيل الدخول عبر جوجل =====
  const googleProvider = new GoogleAuthProvider();
  const googleBtn = document.getElementById('googleBtn');
  const googleDivider = document.getElementById('googleDivider');
  const googleNamesForm = document.getElementById('googleNamesForm');
  let pendingGoogleUser = null;

  googleBtn.addEventListener('click', async () => {
    setMsg('جاري فتح نافذة جوجل...', '');
    try {
      const result = await signInWithPopup(auth, googleProvider);
      const user = result.user;
      const userSnap = await get(ref(db, 'users/' + user.uid));

      if (userSnap.exists()) {
        setMsg('تم تسجيل الدخول بنجاح', 'ok');
        window.location.href = 'editor.html';
        return;
      }

      // مستخدم جديد بجوجل — نطلب منه أسماء العروسين قبل إنشاء الدعوة
      awaitingGoogleNames = true;
      pendingGoogleUser = user;
      loginForm.style.display = 'none';
      signupForm.style.display = 'none';
      document.querySelector('.tabs').style.display = 'none';
      googleDivider.style.display = 'none';
      googleBtn.style.display = 'none';
      googleNamesForm.style.display = 'block';
      setMsg('', '');
    } catch (err) {
      setMsg('تعذر تسجيل الدخول عبر جوجل، حاول مرة أخرى', 'error');
    }
  });

  googleNamesForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!pendingGoogleUser) return;
    const groom = document.getElementById('gGroomName').value;
    const bride = document.getElementById('gBrideName').value;

    setMsg('جاري إنشاء دعوتكم...', '');
    try {
      const baseSlug = slugify(groom, bride);
      const slug = await uniqueSlug(baseSlug);

      await set(ref(db, 'users/' + pendingGoogleUser.uid), {
        email: pendingGoogleUser.email || '', slug, role: 'couple', createdAt: Date.now()
      });

      await set(ref(db, 'invitations/' + slug), {
        ownerUid: pendingGoogleUser.uid,
        groomName: groom,
        brideName: bride,
        eventType: 'wedding',
        theme: presetTheme,
        published: false,
        views: 0,
        createdAt: Date.now()
      });

      awaitingGoogleNames = false;
      window.location.href = 'editor.html';
    } catch (err) {
      setMsg('حدث خطأ، حاول مرة أخرى', 'error');
    }
  });
</script>

</body>
</html>
