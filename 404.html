<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دعوة فرح</title>
<script>
  // GitHub Pages بيعرض 404.html لأي رابط مش موجود فعليًا زي /mohamed&mona
  // هنا بناخد اسم الرابط (السلاج) ونحوّل المستخدم لصفحة الدعوة invite.html
  (function () {
    var path = window.location.pathname.replace(/^\/+/, '').replace(/\/+$/, '');
    var reserved = ['', 'index.html', 'login.html', 'editor.html', 'admin.html', 'invite.html', '404.html'];
    if (path && reserved.indexOf(path) === -1) {
      window.location.replace('/invite.html?slug=' + encodeURIComponent(path) + window.location.search.replace(/^\?/, '&'));
    } else {
      window.location.replace('/index.html');
    }
  })();
</script>
</head>
<body>
  <p style="font-family:sans-serif;text-align:center;margin-top:40px">جاري تحويلكم لصفحة الدعوة...</p>
</body>
</html>
