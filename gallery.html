    <style>
        /* ===================================
           Gallery Page Specific Styles
           =================================== */
        
        .main-content {
            flex: 1;
            margin-right: 280px;
            padding: 30px;
            min-height: 100vh;
            transition: margin var(--transition-normal);
        }
        
        @media (max-width: 1024px) {
            .main-content {
                margin-right: 0;
                padding: 20px;
            }
        }
        
        /* Page Header */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .page-header h1 {
            font-size: 1.75rem;
            color: var(--text-primary);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .page-header h1 i {
            color: var(--gold);
        }
        
        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        /* Upload Zone */
        .upload-zone {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-xl);
            padding: 50px 30px;
            text-align: center;
            background: var(--bg-light);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }
        
        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
        }
        
        .upload-zone.dragover {
            transform: scale(1.02);
        }
        
        .upload-zone-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--gold), #d4a574);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2rem;
            color: white;
        }
        
        .upload-zone h3 {
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 1.25rem;
        }
        
        .upload-zone p {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        
        .upload-zone .browse-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--gold), #d4a574);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-zone .browse-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
        }
        
        .upload-input {
            display: none;
        }
        
        /* Upload Progress */

        }
        
        .upload-progress-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 25px;
            box-shadow: var(--shadow-sm);
        }
        
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .progress-header h4 {
            margin: 0;

        .progress-percentage {
            color: var(--gold);

        }
        
        .progress-bar-wrapper {

            background: var(--bg-light);

        }
        
        .modal-nav {
            position: absolute;

            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.25rem;
            cursor: pointer;

        }
        
        .modal-nav:hover {

        }

        }

        /* Gallery Stats Bar */

        /* Loading Skeleton */

            background: linear-gradient(90deg, var(--bg-light) 25%, #f0f0f0 50%, var(--bg-light) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-lg);
            aspect-ratio: 1;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }
            
            .upload-zone {
                padding: 30px 20px;
            }
            
            .modal-nav.prev { right: 10px; }
            .modal-nav.next { left: 10px; }
        }

    <script>
        // ===================================
        // Gallery Module - Global Variables
        // ===================================
        let galleryImages = [];
        let currentModalIndex = 0;
        let selectedImages = new Set();
        const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10MB
        const ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
        
        // ===================================
        // Initialize Gallery
        // ===================================
        document.addEventListener('DOMContentLoaded', function() {
            initUploadZone();
            loadGalleryImages();
            AOS.init({ duration: 600, once: true });
        });

        // Auth resolves asynchronously; if this page's first load happened
        // before window.currentUserId was set, reload the gallery once it is.
        document.addEventListener('da3wat:authReady', function() {
            loadGalleryImages();
        });
        
        // ===================================
        // Upload Zone & Drag & Drop
        // ===================================
        function initUploadZone() {
            const uploadZone = document.getElementById('uploadZone');
            const fileInput = document.getElementById('fileInput');
            
            // Click to upload
            uploadZone.addEventListener('click', function(e) {
                if (e.target.tagName !== 'BUTTON') {
                    fileInput.click();
                }
            });
            
            // File input change
            fileInput.addEventListener('change', function(e) {
                handleFiles(e.target.files);
                this.value = ''; // Reset input
            });
            
            // Drag events
            uploadZone.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.classList.add('dragover');
            });
            
            uploadZone.addEventListener('dragleave', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
            });
            
            uploadZone.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
                handleFiles(e.dataTransfer.files);
            });
        }
        
        // ===================================
        // Handle File Upload
        // ===================================
        async function handleFiles(files) {
            if (!files || files.length === 0) return;
            if (!window.currentUserId) {
                window.db.showNotification('يجب تسجيل الدخول أولاً', 'error');
                return;
            }
            
            // Validate files
            const validFiles = Array.from(files).filter(file => {
                if (!ALLOWED_TYPES.includes(file.type)) {
                    window.db.showNotification(`نوع الملف غير مدعوم: ${file.name}`, 'error');
                    return false;
                }
                if (file.size > MAX_FILE_SIZE) {
                    window.db.showNotification(`حجم الملف كبير جداً: ${file.name} (الحد الأقصى 10MB)`, 'error');
                    return false;
                }
                return true;
            });
            
            if (validFiles.length === 0) return;
            
            // Show progress
            showUploadProgress(validFiles.length);
            
            // Upload files
            let successCount = 0;
            for (let i = 0; i < validFiles.length; i++) {
                updateProgress(i, validFiles.length, validFiles[i].name);
                
                try {
                    const result = await window.db.uploadToR2(validFiles[i], 'image');
                    
                    if (result.success) {
                        // Save to Firebase
                        await saveImageToFirebase({
                            url: result.url,
                            key: result.key,
                            name: validFiles[i].name,
                            size: validFiles[i].size,
                            type: validFiles[i].type,
                            uploadedAt: Date.now()
                        });
                        successCount++;
                    } else {
                        console.error('Upload failed:', result.error);
                    }
                } catch (error) {
                    console.error('Error uploading file:', error);
                }
                
                await new Promise(resolve => setTimeout(resolve, 300)); // Small delay
            }
            
            // Hide progress and reload
            hideUploadProgress();
            await loadGalleryImages();
            
            if (successCount > 0) {
                window.db.showNotification(`تم رفع ${successCount} صورة بنجاح`, 'success');
            }
        }
        
        // ===================================
        // Upload Progress UI
        // ===================================
        function showUploadProgress(totalFiles) {
            const container = document.getElementById('uploadProgressContainer');
            container.style.display = 'block';
            document.getElementById('uploadZone').style.display = 'none';
        }
        
        function updateProgress(current, total, fileName) {
            const percentage = Math.round((current / total) * 100);
            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('progressPercentage').textContent = percentage + '%';
            document.getElementById('progressFiles').textContent = `جاري رفع: ${fileName} (${current}/${total})`;
        }
        
        function hideUploadProgress() {
            const container = document.getElementById('uploadProgressContainer');
            container.style.display = 'none';
            document.getElementById('uploadZone').style.display = 'block';
            document.getElementById('progressBar').style.width = '0%';
        }
        
        // ===================================
        // Save Image to Firebase
        // ===================================
        async function saveImageToFirebase(imageData) {
            if (!window.currentUserId) return;
            
            try {
                const imageRef = window.firebaseDb.ref(`users/${window.currentUserId}/gallery`).push();
                await imageRef.set({
                    ...imageData,
                    isCover: false
                });
                return imageRef.key;
            } catch (error) {
                console.error('Error saving image:', error);
                throw error;
            }
        }
        
        // ===================================
        // Load Gallery Images from Firebase
        // ===================================
        async function loadGalleryImages() {
            const grid = document.getElementById('galleryGrid');
            const emptyState = document.getElementById('emptyGallery');
            
            if (!window.currentUserId) {
                showEmptyState();
                return;
            }
            
            try {
                // Show loading skeleton
                grid.innerHTML = Array(6).fill('').map(() => `
                    <div class="gallery-item">
                        <div class="gallery-skeleton"></div>
                    </div>
                `).join('');
                
                const snapshot = await window.rtdbOnce(`users/${window.currentUserId}/gallery`);
                
                if (snapshot) {
                    galleryImages = Object.keys(snapshot).map(key => ({
                        id: key,
                        ...snapshot[key]
                    }));
                    
                    updateStats(galleryImages);
                    
                    if (galleryImages.length === 0) {
                        showEmptyState();
                    } else {
                        renderGallery(galleryImages);
                    }
                } else {
                    galleryImages = [];
                    showEmptyState();
                }
            } catch (error) {
                console.error('Error loading gallery:', error);
                window.db.showNotification('حدث خطأ في تحميل الصور', 'error');
                showEmptyState();
            }
        }
        
        // ===================================
        // Render Gallery Grid
        // ===================================
        function renderGallery(images) {
            const grid = document.getElementById('galleryGrid');
            const emptyState = document.getElementById('emptyGallery');
            
            if (images.length === 0) {
                grid.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            
            grid.innerHTML = images.map((img, index) => `
                <div class="gallery-item" data-id="${img.id}" data-aos="fade-up" data-aos-delay="${index * 50}">
                    ${img.isCover ? '<div class="cover-badge"><i class="fas fa-star"></i> الغلاف</div>' : ''}
                    <div class="gallery-item-image">
                        <img src="${img.url}" alt="${img.name}" loading="lazy" 
                             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23f0f0f0%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2250%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2212%22>No Image</text></svg>'">
                        <div class="gallery-item-overlay">
                            <button class="overlay-btn" onclick="previewImage(${index})" title="عرض">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="overlay-btn" onclick="setAsCover('${img.id}')" title="تعيين كغلاف">
                                <i class="fas fa-star"></i>
                            </button>
                            <button class="overlay-btn" onclick="downloadImage('${img.url}', '${img.name}')" title="تحميل">
                                <i class="fas fa-download"></i>
                            </button>
                            <button class="overlay-btn danger" onclick="deleteImage('${img.id}', '${img.key}')" title="حذف">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="gallery-item-info">
                        <div class="gallery-item-name">${img.name}</div>
                        <div class="gallery-item-meta">
                            <span>${formatFileSize(img.size)}</span>
                            <span>${formatDate(img.uploadedAt)}</span>
                        </div>
                    </div>
                </div>
            `).join('');
            
            // Refresh AOS
            AOS.refresh();
        }
        
        // ===================================
        // Image Actions
        // ===================================
        
        // Preview Image in Modal
        function previewImage(index) {
            currentModalIndex = index;
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            
            modalImg.src = galleryImages[index].url;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('active');
            document.body.style.overflow = '';
        }
        
        function navigateModal(direction) {
            currentModalIndex += direction;
            if (currentModalIndex < 0) currentModalIndex = galleryImages.length - 1;
            if (currentModalIndex >= galleryImages.length) currentModalIndex = 0;
            
            document.getElementById('modalImage').src = galleryImages[currentModalIndex].url;
        }
        
        // Set as Cover
        async function setAsCover(imageId) {
            if (!window.currentUserId) return;
            
            try {
                // Remove cover from all images
                const snapshot = await window.rtdbOnce(`users/${window.currentUserId}/gallery`);
                if (snapshot) {
                    Object.keys(snapshot).forEach(key => {
                        window.firebaseDb.ref(`users/${window.currentUserId}/gallery/${key}/isCover`).set(false);
                    });
                }
                
                // Set new cover
                await window.rtdbUpdate(`users/${window.currentUserId}/gallery/${imageId}`, { isCover: true });
                
                await loadGalleryImages();
                window.db.showNotification('تم تعيين الصورة كغلاف', 'success');
            } catch (error) {
                console.error('Error setting cover:', error);
                window.db.showNotification('حدث خطأ', 'error');
            }
        }
        
        // Delete Image
        async function deleteImage(imageId, r2Key) {
            if (!confirm('هل أنت متأكد من حذف هذه الصورة؟')) return;
            if (!window.currentUserId) return;
            
            try {
                // Delete from R2
                if (r2Key) {
                    await window.db.deleteFromR2(r2Key);
                }
                
                // Delete from Firebase
                await window.rtdbRemove(`users/${window.currentUserId}/gallery/${imageId}`);
                
                await loadGalleryImages();
                window.db.showNotification('تم حذف الصورة بنجاح', 'success');
            } catch (error) {
                console.error('Error deleting image:', error);
                window.db.showNotification('حدث خطأ في حذف الصورة', 'error');
            }
        }
        
        // Download Image
        function downloadImage(url, filename) {
            const link = document.createElement('a');
            link.href = url;
            link.download = filename || 'image.jpg';
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        // Select All Images
        function selectAllImages() {
            const items = document.querySelectorAll('.gallery-item');
            items.forEach(item => item.classList.toggle('selected'));
        }
        
        // ===================================
        // Stats & Helpers
        // ===================================
        function updateStats(images) {
            document.getElementById('totalImages').textContent = images.length;
            
            const totalSize = images.reduce((sum, img) => sum + (img.size || 0), 0);
            document.getElementById('storageUsed').textContent = formatFileSize(totalSize);
        }
        
        function showEmptyState() {
            document.getElementById('galleryGrid').innerHTML = '';
            document.getElementById('emptyGallery').style.display = 'block';
            document.getElementById('totalImages').textContent = '0';
            document.getElementById('storageUsed').textContent = '0 MB';
        }
        
        function formatFileSize(bytes) {
            if (!bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function formatDate(timestamp) {
            if (!timestamp) return '';
            return new Date(timestamp).toLocaleDateString('ar-SA', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }
        
        // Keyboard navigation for modal
        document.addEventListener('keydown', function(e) {
            const modal = document.getElementById('imageModal');
            if (!modal.classList.contains('active')) return;
            
            if (e.key === 'Escape') closeImageModal();
            if (e.key === 'ArrowLeft') navigateModal(1); // RTL
            if (e.key === 'ArrowRight') navigateModal(-1);
        });
        
        // Close modal on backdrop click
        document.getElementById('imageModal').addEventListener('click', function(e) {
            if (e.target === this) closeImageModal();
        });
        
        console.log('✅ Gallery page initialized');
    </script>
    <script src="/js/pwa-manager.js" defer></script>
</body>
</html>
