<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة المالك | دعوة فرح</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0B0F0E;--panel:#152420;--panel2:#0F1B17;--gold:#C9A227;--gold-light:#E8C766;--text:#F5F1E8;--text-dim:#A9B3AC;--line:rgba(201,162,39,.22);--green:#8CE0A0;--red:#E88;--orange:#E8B766}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 5%;border-bottom:1px solid var(--line)}
  .logo{font-family:'Amiri',serif;font-size:22px;color:var(--gold-light)}
  .btn{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--text);font-family:'Cairo';font-weight:700;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--gold)}
  main{padding:30px 5%;max-width:1300px;margin:0 auto}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:24px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center}
  .stat b{display:block;font-family:'Amiri',serif;font-size:26px;color:var(--gold-light)}
  .stat span{font-size:12px;color:var(--text-dim)}
  @media(max-width:900px){.stats{grid-template-columns:1fr 1fr 1fr}}
  @media(max-width:560px){.stats{grid-template-columns:1fr 1fr}}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;justify-content:space-between}
  input#search{flex:1;min-width:220px;max-width:320px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-family:'Cairo'}
  .tabs{display:flex;gap:8px;flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--text-dim);font-size:12.5px;font-weight:700;cursor:pointer;font-family:'Cairo'}
  .tab.active{background:var(--gold);color:#0B0F0E;border-color:var(--gold)}
  .table-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel)}
  th,td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th{color:var(--gold-light);background:var(--panel2);position:sticky;top:0}
  tr:last-child td{border-bottom:none}
  .tag{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;display:inline-block}
  .tag.pub{background:rgba(140,224,160,.15);color:var(--green)}
  .tag.pending{background:rgba(232,183,102,.18);color:var(--orange)}
  .tag.rejected{background:rgba(232,136,136,.18);color:var(--red)}
  .tag.draft{background:rgba(169,179,172,.15);color:var(--text-dim)}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .row-actions button, .row-actions a{font-size:11px;padding:6px 10px;border-radius:8px;border:none;cursor:pointer;text-decoration:none;color:#0B0F0E;font-weight:700;font-family:'Cairo'}
  .gate{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:14px}
  .gate p{color:var(--text-dim);font-size:14px}
  .empty{padding:40px;text-align:center;color:var(--text-dim)}
  #adminLoginForm{display:flex;flex-direction:column;gap:12px;align-items:center}
  #adminPassword{padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-family:'Cairo';font-size:15px;text-align:center;min-width:240px;letter-spacing:2px}
  #adminPassword:focus{outline:none;border-color:var(--gold)}
  .gate .btn{background:var(--gold);color:#0B0F0E;border-color:var(--gold)}
  .gate .btn:disabled{opacity:.6;cursor:not-allowed}
  #adminLoginError{color:var(--red);font-size:13px;min-height:16px}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="logo">لوحة المالك</div>
  <p>أدخل كلمة سر المالك للمتابعة</p>
  <form id="adminLoginForm">
    <input type="password" id="adminPassword" placeholder="كلمة السر" autocomplete="off" required>
    <button type="submit" class="btn" id="adminLoginBtn">دخول</button>
    <p id="adminLoginError"></p>
  </form>
</div>

<div id="dashboard" style="display:none">
  <header>
    <div class="logo">لوحة المالك — دعوة فرح</div>
    <button class="btn" id="logoutBtn">تسجيل الخروج</button>
  </header>
  <main>
    <div class="stats">
      <div class="stat"><b id="statTotal">0</b><span>إجمالي الدعوات</span></div>
      <div class="stat"><b id="statPending">0</b><span>بانتظار المراجعة</span></div>
      <div class="stat"><b id="statPublished">0</b><span>منشورة</span></div>
      <div class="stat"><b id="statViews">0</b><span>إجمالي المشاهدات</span></div>
      <div class="stat"><b id="statRsvp">0</b><span>تأكيدات حضور</span></div>
    </div>

    <div class="toolbar">
      <div class="tabs" id="tabs">
        <button class="tab active" data-filter="all">الكل</button>
        <button class="tab" data-filter="needs_review">بحاجة لمراجعة الدفع</button>
        <button class="tab" data-filter="unpaid">بانتظار اختيار/دفع العميل</button>
        <button class="tab" data-filter="published">منشورة</button>
        <button class="tab" data-filter="rejected">مرفوضة</button>
      </div>
      <input id="search" placeholder="ابحث بالاسم أو الرابط...">
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>الرابط</th><th>الأسماء</th><th>الباقة</th><th>حالة الدفع</th>
            <th>الإيصال</th><th>حالة النشر</th><th>المشاهدات</th><th>تاريخ الإنشاء</th><th>إجراءات</th>
          </tr>
        </thead>
        <tbody id="invTable"></tbody>
      </table>
      <div class="empty" id="emptyState" style="display:none">لا توجد دعوات مطابقة</div>
    </div>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, get, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // Worker endpoint that verifies the admin password (521988 by default,
  // see worker.js) and, on success, hands back the hidden Firebase admin
  // account used to satisfy database.rules.json.
  const ADMIN_WORKER_URL = 'https://da3watfarah.nonm1724.workers.dev';

  // ===== إعدادات فايربيز — استبدل بالقيم الخاصة بمشروعك =====
  const firebaseConfig = {
    apiKey: "AIzaSyAIyJ_oZdA1VGDMfKwCUfQwdO5ZOoQy2DQ",
    authDomain: "da3watfarah.firebaseapp.com",
    databaseURL: "https://da3watfarah-default-rtdb.firebaseio.com",
    projectId: "da3watfarah",
    storageBucket: "da3watfarah.firebasestorage.app",
    messagingSenderId: "818147201311",
    appId: "1:818147201311:web:cb83942913bc2d6a86e02a",
    measurementId: "G-J9D7R961V7"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  // Setup note (one-time, done by the site owner — not the admin typing
  // the password every day):
  // 1) Create one Firebase user (Firebase Console, or register.html) to
  //    act as the hidden admin account.
  // 2) In the Realtime Database add: admins/{that user's uid} = true
  // 3) On the Worker (Settings > Variables and secrets) set:
  //    ADMIN_FIREBASE_EMAIL, ADMIN_FIREBASE_PASSWORD, and optionally
  //    ADMIN_PASSWORD (defaults to 521988 — see worker.js).
  // After that, admin.html only ever asks for the numeric password.

  let allInvitations = {}; // keyed by invitationId (push key from db.js)
  let currentFilter = 'all';
  let currentSearch = '';

  onAuthStateChanged(auth, async (user) => {
    if (!user) return;
    const adminSnap = await get(ref(db, 'admins/' + user.uid));
    if (!adminSnap.exists() || adminSnap.val() !== true) return; // مش أدمن، يفضل على شاشة الدخول
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadInvitations();
  });

  document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth).then(() => location.reload()));

  // Password-only admin login. The password is checked on the Worker
  // (never in this front-end file); on success the Worker returns the
  // hidden Firebase admin credentials used to actually sign in.
  document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const passwordInput = document.getElementById('adminPassword');
    const loginBtn = document.getElementById('adminLoginBtn');
    const errorEl = document.getElementById('adminLoginError');
    const password = passwordInput.value;

    errorEl.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'جارٍ التحقق...';

    try {
      const res = await fetch(`${ADMIN_WORKER_URL}/api/admin/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      const data = await res.json();

      if (!res.ok || !data.success) {
        errorEl.textContent = data.error || 'كلمة السر غير صحيحة';
        return;
      }

      await signInWithEmailAndPassword(auth, data.email, data.password);
      // onAuthStateChanged above takes it from here (checks admins/{uid}
      // then shows the dashboard).
    } catch (err) {
      console.error('Admin login error:', err);
      errorEl.textContent = 'تعذر تسجيل الدخول، حاول مرة أخرى';
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'دخول';
      passwordInput.value = '';
    }
  });

  const paymentStatusLabels = {
    unpaid: { text: 'بانتظار اختيار الباقة', cls: 'draft' },
    pending_verification: { text: 'بانتظار مراجعة الإيصال', cls: 'pending' },
    verified: { text: 'تم التحقق والدفع', cls: 'pub' },
    rejected: { text: 'مرفوض', cls: 'rejected' },
    not_required: { text: 'باقة مجانية', cls: 'pub' }
  };

  async function loadInvitations(){
    const snap = await get(ref(db, 'invitations'));
    allInvitations = snap.exists() ? snap.val() : {};
    renderStats();
    applyFiltersAndRender();
  }

  function renderStats(){
    const entries = Object.entries(allInvitations);
    document.getElementById('statTotal').textContent = entries.length;
    document.getElementById('statPending').textContent = entries.filter(([,v]) => v.status === 'pending_review').length;
    document.getElementById('statPublished').textContent = entries.filter(([,v]) => v.isPublished).length;
    document.getElementById('statViews').textContent = entries.reduce((s,[,v]) => s + (v.viewsCount||0), 0);
    document.getElementById('statRsvp').textContent = entries.reduce((s,[,v]) => s + (v.rsvpsCount||0), 0);
  }

  function matchesFilter(inv){
    const payStatus = inv.payment?.status || 'unpaid';
    switch(currentFilter){
      case 'needs_review': return payStatus === 'pending_verification';
      case 'unpaid': return payStatus === 'unpaid' && !inv.isPublished;
      case 'published': return !!inv.isPublished;
      case 'rejected': return inv.status === 'rejected' || payStatus === 'rejected';
      default: return true;
    }
  }

  function matchesSearch(inv){
    if (!currentSearch) return true;
    const q = currentSearch;
    return (inv.slug||'').toLowerCase().includes(q) ||
      (inv.couple?.groomName||'').toLowerCase().includes(q) ||
      (inv.couple?.brideName||'').toLowerCase().includes(q);
  }

  function applyFiltersAndRender(){
    const ids = Object.keys(allInvitations).filter(id =>
      matchesFilter(allInvitations[id]) && matchesSearch(allInvitations[id]));
    renderTable(ids);
  }

  function renderTable(ids){
    const tbody = document.getElementById('invTable');
    const emptyState = document.getElementById('emptyState');
    tbody.innerHTML = '';

    if (ids.length === 0){
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    ids.sort((a,b) => (allInvitations[b].createdAt||0) - (allInvitations[a].createdAt||0)).forEach(id => {
      const inv = allInvitations[id];
      const payment = inv.payment || {};
      const payInfo = paymentStatusLabels[payment.status || 'unpaid'];
      const publishTag = inv.isPublished
        ? '<span class="tag pub">منشورة</span>'
        : (inv.status === 'rejected' ? '<span class="tag rejected">مرفوضة</span>' : '<span class="tag draft">غير منشورة</span>');

      const planText = payment.planLabel
        ? `${payment.planLabel}${payment.amount ? ` (${payment.amount} ${payment.currency||''})` : ''}`
        : '—';

      const receiptCell = payment.receiptUrl
        ? `<a href="${payment.receiptUrl}" target="_blank" style="background:var(--gold-light)">عرض الإيصال</a>`
        : '—';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="direction:ltr">${inv.slug||''}</td>
        <td>${inv.couple?.groomName||''} &amp; ${inv.couple?.brideName||''}</td>
        <td>${planText}</td>
        <td><span class="tag ${payInfo.cls}">${payInfo.text}</span></td>
        <td>${receiptCell}</td>
        <td>${publishTag}</td>
        <td>${inv.viewsCount||0}</td>
        <td>${inv.createdAt ? new Date(inv.createdAt).toLocaleDateString('ar-EG') : '-'}</td>
        <td class="row-actions">
          <a href="/${inv.slug}" target="_blank" style="background:var(--gold-light)">فتح</a>
          ${!inv.isPublished ? `<button style="background:var(--green)" data-approve="${id}">موافقة ونشر</button>` : `<button style="background:var(--text-dim)" data-unpublish="${id}">إلغاء النشر</button>`}
          ${inv.status !== 'rejected' ? `<button style="background:var(--red)" data-reject="${id}">رفض</button>` : ''}
          <button style="background:var(--red)" data-del="${id}">حذف</button>
        </td>`;
      tbody.appendChild(tr);
    });

    tbody.querySelectorAll('[data-approve]').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.approve;
      await update(ref(db, 'invitations/' + id), {
        isPublished: true,
        status: 'active',
        'payment/status': allInvitations[id].payment?.plan === 'free' ? 'not_required' : 'verified',
        'payment/verifiedAt': Date.now()
      });
      Object.assign(allInvitations[id], { isPublished: true, status: 'active' });
      renderStats();
      applyFiltersAndRender();
    }));

    tbody.querySelectorAll('[data-unpublish]').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.unpublish;
      await update(ref(db, 'invitations/' + id), { isPublished: false, status: 'draft' });
      Object.assign(allInvitations[id], { isPublished: false, status: 'draft' });
      renderStats();
      applyFiltersAndRender();
    }));

    tbody.querySelectorAll('[data-reject]').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.reject;
      const reason = prompt('سبب الرفض (سيظهر للعميل لاحقًا، اختياري):') || '';
      await update(ref(db, 'invitations/' + id), {
        isPublished: false,
        status: 'rejected',
        'payment/status': 'rejected',
        'payment/rejectionReason': reason
      });
      Object.assign(allInvitations[id], { isPublished: false, status: 'rejected' });
      renderStats();
      applyFiltersAndRender();
    }));

    tbody.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('متأكد إنك عايز تحذف الدعوة دي نهائيًا؟')) return;
      await remove(ref(db, 'invitations/' + b.dataset.del));
      delete allInvitations[b.dataset.del];
      renderStats();
      applyFiltersAndRender();
    }));
  }

  document.getElementById('search').addEventListener('input', (e) => {
    currentSearch = e.target.value.trim().toLowerCase();
    applyFiltersAndRender();
  });

  document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    applyFiltersAndRender();
  });
</script>

</body>
</html>
