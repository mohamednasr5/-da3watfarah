<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحويل... | دعوة فرح</title>
    <meta http-equiv="refresh" content="0; url=overview.html">
    <script>
        // dashboard.html is a legacy entry point kept for old bookmarks/links.
        // The app now uses separate pages per section instead of #hash routing.
        // Map the old hash (e.g. #create-invitation) to its real page.
        (function () {
            var map = {
                'overview': 'overview.html',
                'create-invitation': 'create-invitation.html',
                'my-invitations': 'my-invitations.html',
                'gallery': 'gallery.html',
                'music': 'music.html',
                'ai-writer': 'ai-writer.html',
                'settings': 'settings.html'
            };
            var hash = window.location.hash.replace('#', '');
            var target = map[hash] || 'overview.html';
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p>جاري التحويل إلى لوحة التحكم... <a href="overview.html">اضغط هنا إذا لم يتم تحويلك تلقائياً</a></p>
</body>
</html>
