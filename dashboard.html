    <script>
        // dashboard.html is a legacy entry point kept for old bookmarks/links.
        // The app now uses separate pages per section instead of #hash routing.
        // Map the old hash (e.g. #create-invitation) to its real page.
        (function () {
            var map = {
                'overview': 'overview.html',
                'create-invitation': 'create-invitation.html',
                'my-invitations': 'my-invitations.html',
                'gallery': 'gallery.html',
                'music': 'music.html',
                'ai-writer': 'ai-writer.html',
                'settings': 'settings.html'
            };
            var hash = window.location.hash.replace('#', '');
            var target = map[hash] || 'overview.html';
            window.location.replace(target);
        })();
    </script>
