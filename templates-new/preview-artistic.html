<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة قالب الفن | دعوة فرح</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #4a1942;
            --secondary: #e94560;
            --accent: #f39c12;
            --purple: #8e44ad;
            --deep: #1a0a2e;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #4a1942 50%, #16213e 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }
        
        /* Artistic Background */
        .art-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        
        /* Abstract Shapes */
        .art-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: shapeFloat 15s ease-in-out infinite;
        }
        
        @keyframes shapeFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -40px) scale(1.1); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(40px, 30px) scale(1.05); }
        }
        
        .shape-1 {
            width: 400px;
            height: 400px;
            background: var(--secondary);
            top: -150px;
            right: -100px;
            animation-delay: 0s;
        }
        
        .shape-2 {
            width: 350px;
            height: 350px;
            background: var(--purple);
            bottom: -120px;
            left: -80px;
            animation-delay: -5s;
        }
        
        .shape-3 {
            width: 250px;
            height: 250px;
            background: var(--accent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
        }
        
        /* Paint Splatter */
        .splatter {
            position: absolute;
            font-size: 2rem;
            opacity: 0.08;
            animation: splatterDrop 8s ease-in-out infinite;
        }
        
        @keyframes splatterDrop {
            0% { 
                transform: translateY(-50px) rotate(0deg) scale(0); 
                opacity: 0; 
            }
            20% { opacity: 0.08; transform: scale(1); }
            80% { opacity: 0.08; }
            100% { 
                transform: translateY(100vh) rotate(360deg) scale(1.5); 
                opacity: 0; 
            }
        }
        
        /* Main Container */
        .invitation-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 1;
        }
        
        /* Artistic Card */
        .artistic-card {
            background: rgba(26, 10, 46, 0.7);
            border-radius: 30px;
            padding: 55px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(25px);
            border: 2px solid transparent;
            background-image: linear-gradient(rgba(26, 10, 46, 0.7), rgba(26, 10, 46, 0.7)), 
                              linear-gradient(135deg, var(--secondary), var(--purple), var(--accent));
            background-origin: border-box;
            background-clip: padding-box, border-box;
        }
        
        /* Animated Border Gradient */
        .artistic-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--secondary), var(--purple), var(--accent), var(--secondary));
            background-size: 400% 400%;
            border-radius: 32px;
            z-index: -1;
            animation: gradientBorder 6s ease infinite;
            opacity: 0.7;
        }
        
        @keyframes gradientBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Palette Icon */
        .palette-icon {
            font-size: 3.5rem;
            margin-bottom: 22px;
            opacity: 0;
            animation: paintSplash 1.2s ease forwards;
            animation-delay: 0.3s;
            filter: drop-shadow(0 8px 25px rgba(233, 69, 96, 0.5));
        }
        
        @keyframes paintSplash {
            0% { opacity: 0; transform: scale(0) rotate(-180deg); }
            60% { transform: scale(1.2) rotate(15deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        
        /* Bismillah */
        .bismillah {
            font-family: 'Aref Ruqaa', serif;
            font-size: 1.45rem;
            color: var(--accent);
            margin-bottom: 22px;
            opacity: 0;
            animation: artFadeIn 1s ease forwards;
            animation-delay: 0.5s;
            text-shadow: 0 0 25px rgba(243, 156, 18, 0.4);
        }
        
        @keyframes artFadeIn {
            from { opacity: 0; transform: translateY(-15px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        /* Couple Names */
        .couple-names {
            margin: 28px 0;
            opacity: 0;
            animation: artisticReveal 1.4s ease forwards;
            animation-delay: 0.75s;
        }
        
        @keyframes artisticReveal {
            from { 
                opacity: 0; 
                transform: perspective(800px) rotateY(25deg) translateX(30px);
                filter: blur(8px);
            }
            to { 
                opacity: 1; 
                transform: perspective(800px) rotateY(0) translateX(0);
                filter: blur(0);
            }
        }
        
        .couple-names h1 {
            font-family: 'Aref Ruqaa', serif;
            font-size: 3rem;
            font-weight: 700;
            line-height: 1.65;
        }
        
        .name-groom {
            background: linear-gradient(135deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .name-bride {
            background: linear-gradient(135deg, var(--secondary), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Art Divider */
        .art-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 26px 0;
            opacity: 0;
            animation: artExpand 1s ease forwards;
            animation-delay: 1.2s;
        }
        
        @keyframes artExpand {
            from { opacity: 0; transform: scaleX(0); }
            to { opacity: 1; transform: scaleX(1); }
        }
        
        .art-line {
            height: 2px;
            width: 55px;
            background: linear-gradient(90deg, transparent, var(--secondary));
        }
        
        .art-line:last-child {
            background: linear-gradient(90deg, var(--purple), transparent);
        }
        
        .art-icon-center {
            font-size: 1.4rem;
            animation: spinSlow 8s linear infinite;
        }
        
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Wedding Title */
        .wedding-title {
            font-size: 1.15rem;
            color: rgba(255, 255, 255, 0.88);
            font-weight: 300;
            letter-spacing: 2px;
            margin: 22px 0;
            opacity: 0;
            animation: artFadeIn 1s ease forwards;
            animation-delay: 1.45s;
        }
        
        /* Date Section */
        .date-section {
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.15), rgba(142, 68, 173, 0.15));
            border: 1px solid rgba(233, 69, 96, 0.25);
            border-radius: 22px;
            padding: 24px;
            margin: 22px 0;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: paintFill 1s ease forwards;
            animation-delay: 1.65s;
        }
        
        @keyframes paintFill {
            from { 
                opacity: 0; 
                clip-path: circle(0% at 50% 50%);
            }
            to { 
                opacity: 1; 
                clip-path: circle(100% at 50% 50%);
            }
        }
        
        .date-label {
            font-size: 0.87rem;
            color: var(--accent);
            margin-bottom: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .date-value {
            font-family: 'Aref Ruqaa', serif;
            font-size: 1.75rem;
            color: #fff;
            font-weight: 700;
        }
        
        /* Location Section */
        .location-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 18px;
            background: linear-gradient(135deg, rgba(243, 156, 18, 0.1), rgba(142, 68, 173, 0.1));
            border: 1px solid rgba(243, 156, 18, 0.2);
            border-radius: 18px;
            margin: 18px 0;
            opacity: 0;
            animation: artFadeIn 1s ease forwards;
            animation-delay: 1.85s;
        }
        
        .location-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--secondary), var(--purple));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: white;
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.35);
            animation: iconPulse 2s ease-in-out infinite;
        }
        
        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 5px 20px rgba(233, 69, 96, 0.35); }
            50% { box-shadow: 0 5px 30px rgba(233, 69, 96, 0.55), 0 0 0 10px rgba(233, 69, 96, 0.1); }
        }
        
        .location-text h4 {
            font-size: 1.05rem;
            color: #fff;
            margin-bottom: 3px;
        }
        
        .location-text p {
            font-size: 0.83rem;
            color: rgba(255, 255, 255, 0.65);
        }
        
        /* RSVP Button */
        .rsvp-btn {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--purple) 50%, var(--accent) 100%);
            background-size: 200% 200%;
            color: white;
            border: none;
            padding: 17px 48px;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 24px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 35px rgba(233, 69, 96, 0.35);
            opacity: 0;
            animation: artBtnRise 0.8s ease forwards;
            animation-delay: 2.05s;
            position: relative;
            overflow: hidden;
            animation: gradientShift 3s ease infinite, artBtnRise 0.8s ease forwards;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes artBtnRise {
            from { opacity: 0; transform: translateY(25px) scale(0.92); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .rsvp-btn:hover {
            transform: translateY(-5px) scale(1.06);
            box-shadow: 0 18px 45px rgba(233, 69, 96, 0.5);
        }
        
        /* Footer */
        .footer-text {
            margin-top: 26px;
            font-size: 0.84rem;
            color: rgba(255, 255, 255, 0.5);
            opacity: 0;
            animation: artFadeIn 1s ease forwards;
            animation-delay: 2.35s;
        }
        
        /* Responsive */
        @media (max-width: 520px) {
            .artistic-card { padding: 42px 28px; border-radius: 25px; }
            .couple-names h1 { font-size: 2.4rem; }
            .palette-icon { font-size: 2.8rem; }
            .bismillah { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <!-- Artistic Background -->
    <div class="art-bg" id="artBg">
        <div class="art-shape shape-1"></div>
        <div class="art-shape shape-2"></div>
        <div class="art-shape shape-3"></div>
    </div>
    
    <!-- Paint Splatters -->
    <div class="splatters-bg" id="splattersBg"></div>
    
    <div class="invitation-container">
        <div class="artistic-card">
            <!-- Palette Icon -->
            <div class="palette-icon">🎨</div>
            
            <!-- Bismillah -->
            <p class="bismillah">بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ</p>
            
            <!-- Couple Names -->
            <div class="couple-names">
                <h1>
                    <span class="name-bride">دانة</span>
                    <span class="name-groom">& رامي</span>
                </h1>
            </div>
            
            <!-- Art Divider -->
            <div class="art-divider">
                <span class="art-line"></span>
                <span class="art-icon-center">✨</span>
                <span class="art-line"></span>
            </div>
            
            <!-- Title -->
            <p class="wedding-title">لوحة فنية من الحب 🖼️</p>
            
            <!-- Date -->
            <div class="date-section">
                <p class="date-label"><i class="fas fa-palette"></i> معرض الفرح</p>
                <p class="date-value">١٤ فبراير ٢٠٢٧</p>
            </div>
            
            <!-- Location -->
            <div class="location-section">
                <div class="location-icon"><i class="fas fa-map-marker-alt"></i></div>
                <div class="location-text">
                    <h4>مركز الفنون التشكيلية</h4>
                    <p>الظهران، المملكة العربية السعودية</p>
                </div>
            </div>
            
            <!-- RSVP Button -->
            <button class="rsvp-btn"><i class="fas fa-paintbrush"></i> انضموا لمعرضنا</button>
            
            <!-- Footer -->
            <p class="footer-text">حيث يلتقي الفن بالحب 🎭</p>
        </div>
    </div>
    
    <script>
        const splattersBg = document.getElementById('splattersBg');
        const splatterEmojis = ['💜', '❤️', '🧡', '💛', '💚', '🩵'];
        
        // Create paint splatters
        for (let i = 0; i < 12; i++) {
            const splatter = document.createElement('div');
            splatter.className = 'splatter';
            splatter.textContent = splatterEmojis[Math.floor(Math.random() * splatterEmojis.length)];
            splatter.style.left = Math.random() * 100 + '%';
            splatter.style.animationDelay = (Math.random() * 8 + i) + 's';
            splatter.style.animationDuration = (Math.random() * 4 + 6) + 's';
            if (!document.getElementById('splattersBg')) {
                document.body.appendChild(splatter);
            } else {
                splattersBg.appendChild(splatter);
            }
        }
    </script>
</body>
</html>
