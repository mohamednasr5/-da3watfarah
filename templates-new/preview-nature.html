<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة قالب الطبيعة | دعوة فرح</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #1a4d3e;
            --secondary: #4ade80;
            --accent: #166534;
            --leaf-light: #dcfce7;
            --earth: #365314;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(180deg, #ecfdf5 0%, #d1fae5 40%, #a7f3d0 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #1a4d3e;
        }
        
        /* Floating Leaves */
        .leaves-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        
        .floating-leaf {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0.12;
            animation: leafFall var(--fall-duration) ease-in-out infinite;
            animation-delay: var(--fall-delay);
        }
        
        @keyframes leafFall {
            0% { 
                transform: translateY(-100px) rotate(0deg) translateX(0); 
                opacity: 0; 
            }
            10% { opacity: 0.12; }
            90% { opacity: 0.12; }
            100% { 
                transform: translateY(100vh) rotate(720deg) translateX(var(--drift)); 
                opacity: 0; 
            }
        }
        
        /* Main Container */
        .invitation-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 1;
        }
        
        /* Nature Card */
        .nature-card {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 35px;
            padding: 50px 38px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 25px 70px rgba(26, 77, 62, 0.12),
                inset 0 0 60px rgba(74, 222, 128, 0.05);
            backdrop-filter: blur(15px);
        }
        
        /* Organic Border */
        .nature-card::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(135deg, var(--secondary), var(--accent), var(--leaf-light));
            border-radius: 38px;
            z-index: -1;
            opacity: 0.6;
        }
        
        /* Leaf Corners */
        .leaf-corner {
            position: absolute;
            font-size: 2rem;
            opacity: 0.25;
        }
        
        .leaf-corner.top-left { top: 15px; left: 15px; transform: rotate(-45deg); }
        .leaf-corner.top-right { top: 15px; right: 15px; transform: rotate(45deg); }
        .leaf-corner.bottom-left { bottom: 15px; left: 15px; transform: rotate(-135deg); }
        .leaf-corner.bottom-right { bottom: 15px; right: 15px; transform: rotate(135deg); }
        
        /* Tree Icon */
        .tree-icon {
            font-size: 3.5rem;
            margin-bottom: 18px;
            opacity: 0;
            animation: treeGrow 1.2s ease forwards;
            animation-delay: 0.3s;
            filter: drop-shadow(0 8px 20px rgba(74, 222, 128, 0.35));
        }
        
        @keyframes treeGrow {
            0% { opacity: 0; transform: scaleY(0) translateY(30px); transform-origin: bottom; }
            60% { transform: scaleY(1.08) translateY(-5px); }
            100% { opacity: 1; transform: scaleY(1) translateY(0); }
        }
        
        /* Bismillah */
        .bismillah {
            font-family: 'Aref Ruqaa', serif;
            font-size: 1.45rem;
            color: var(--accent);
            margin-bottom: 18px;
            opacity: 0;
            animation: natureFadeIn 1s ease forwards;
            animation-delay: 0.5s;
        }
        
        @keyframes natureFadeIn {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Couple Names */
        .couple-names {
            margin: 22px 0;
            opacity: 0;
            animation: bloomOpen 1.3s ease forwards;
            animation-delay: 0.75s;
        }
        
        @keyframes bloomOpen {
            from { 
                opacity: 0; 
                transform: scale(0.85); 
                filter: blur(6px);
            }
            to { 
                opacity: 1; 
                transform: scale(1); 
                filter: blur(0);
            }
        }
        
        .couple-names h1 {
            font-family: 'Aref Ruqaa', serif;
            font-size: 2.9rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.7;
        }
        
        .couple-names .groom-name {
            display: block;
            color: var(--accent);
        }
        
        /* Leaf Divider */
        .leaf-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 22px 0;
            opacity: 0;
            animation: vineSpread 1s ease forwards;
            animation-delay: 1.1s;
        }
        
        @keyframes vineSpread {
            from { opacity: 0; max-width: 0; }
            to { opacity: 1; max-width: 180px; }
        }
        
        .vine-line {
            height: 2px;
            flex: 1;
            max-width: 65px;
            background: linear-gradient(90deg, transparent, var(--secondary));
            border-radius: 2px;
        }
        
        .vine-line:last-child {
            background: linear-gradient(90deg, var(--secondary), transparent);
        }
        
        .vine-icon {
            font-size: 1.3rem;
            animation: sway 3s ease-in-out infinite;
        }
        
        @keyframes sway {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        
        /* Wedding Title */
        .wedding-title {
            font-size: 1.15rem;
            color: var(--earth);
            font-weight: 500;
            margin: 18px 0;
            opacity: 0;
            animation: natureFadeIn 1s ease forwards;
            animation-delay: 1.35s;
        }
        
        /* Date Section */
        .date-section {
            background: linear-gradient(135deg, var(--leaf-light), white);
            border: 2px solid rgba(74, 222, 128, 0.25);
            border-radius: 22px;
            padding: 22px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: sproutUp 1s ease forwards;
            animation-delay: 1.55s;
        }
        
        @keyframes sproutUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .date-section::before {
            content: '🌿';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%) rotate(15deg);
            font-size: 1.5rem;
            opacity: 0.3;
        }
        
        .date-label {
            font-size: 0.88rem;
            color: var(--accent);
            margin-bottom: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .date-value {
            font-family: 'Aref Ruqaa', serif;
            font-size: 1.7rem;
            color: var(--primary);
            font-weight: 700;
        }
        
        /* Location Section */
        .location-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 13px;
            padding: 17px;
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.12), rgba(220, 252, 231, 0.2));
            border: 1px solid rgba(74, 222, 128, 0.25);
            border-radius: 18px;
            margin: 17px 0;
            opacity: 0;
            animation: natureFadeIn 1s ease forwards;
            animation-delay: 1.75s;
        }
        
        .location-icon {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, var(--secondary), #22c55e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: white;
            box-shadow: 0 5px 18px rgba(74, 222, 128, 0.3);
        }
        
        .location-text h4 {
            font-size: 1.02rem;
            color: var(--primary);
            margin-bottom: 3px;
        }
        
        .location-text p {
            font-size: 0.83rem;
            color: var(--earth);
            opacity: 0.85;
        }
        
        /* RSVP Button */
        .rsvp-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            border: none;
            padding: 16px 44px;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 22px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(26, 77, 62, 0.25);
            opacity: 0;
            animation: growBtn 0.8s ease forwards;
            animation-delay: 1.95s;
            position: relative;
            overflow: hidden;
        }
        
        @keyframes growBtn {
            from { opacity: 0; transform: scale(0.88); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .rsvp-btn:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 16px 40px rgba(26, 77, 62, 0.35);
        }
        
        /* Footer */
        .footer-text {
            margin-top: 24px;
            font-size: 0.84rem;
            color: var(--earth);
            opacity: 0.65;
            opacity: 0;
            animation: natureFadeIn 1s ease forwards;
            animation-delay: 2.2s;
        }
        
        /* Responsive */
        @media (max-width: 520px) {
            .nature-card { padding: 38px 26px; border-radius: 28px; }
            .couple-names h1 { font-size: 2.3rem; }
            .tree-icon { font-size: 2.8rem; }
            .bismillah { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <!-- Background Leaves -->
    <div class="leaves-bg" id="leavesBg"></div>
    
    <div class="invitation-container">
        <div class="nature-card">
            <!-- Leaf Corners -->
            <span class="leaf-corner top-left">🍃</span>
            <span class="leaf-corner top-right">🍃</span>
            <span class="leaf-corner bottom-left">🌿</span>
            <span class="leaf-corner bottom-right">🌿</span>
            
            <!-- Tree Icon -->
            <div class="tree-icon">🌳</div>
            
            <!-- Bismillah -->
            <p class="bismillah">بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ</p>
            
            <!-- Couple Names -->
            <div class="couple-names">
                <h1>
                    <span>لمى</span>
                    <span class="groom-name">& سلطان</span>
                </h1>
            </div>
            
            <!-- Leaf Divider -->
            <div class="leaf-divider">
                <span class="vine-line"></span>
                <span class="vine-icon">🍀</span>
                <span class="vine-line"></span>
            </div>
            
            <!-- Wedding Title -->
            <p class="wedding-title">في رحاب الطبيعة نتحد</p>
            
            <!-- Date Section -->
            <div class="date-section">
                <p class="date-label"><i class="fas fa-leaf"></i> يوم الفرح</p>
                <p class="date-value">١٠ نوفمبر ٢٠٢٦</p>
            </div>
            
            <!-- Location -->
            <div class="location-section">
                <div class="location-icon"><i class="fas fa-map-marker-alt"></i></div>
                <div class="location-text">
                    <h4>حديقة الواحة الخضراء</h4>
                    <p>أبها، المملكة العربية السعودية</p>
                </div>
            </div>
            
            <!-- RSVP Button -->
            <button class="rsvp-btn"><i class="fas fa-seedling"></i> شاركوا فرحتنا</button>
            
            <!-- Footer -->
            <p class="footer-text">بين الأشجار والأزهار ننتظركم 🌻</p>
        </div>
    </div>
    
    <script>
        const leavesBg = document.getElementById('leavesBg');
        const leafEmojis = ['🍃', '🌿', '🍀', '🌱', '☘️'];
        
        for (let i = 0; i < 18; i++) {
            const leaf = document.createElement('div');
            leaf.className = 'floating-leaf';
            leaf.textContent = leafEmojis[Math.floor(Math.random() * leafEmojis.length)];
            leaf.style.left = Math.random() * 100 + '%';
            leaf.style.setProperty('--fall-duration', (Math.random() * 10 + 12) + 's');
            leaf.style.setProperty('--fall-delay', Math.random() * 12 + 's');
            leaf.style.setProperty('--drift', (Math.random() * 200 - 100) + 'px');
            leavesBg.appendChild(leaf);
        }
    </script>
</body>
</html>
