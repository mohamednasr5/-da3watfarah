name = "da3watfarah-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"

# ربط باكت R2 لتخزين الصور والأصوات
# اسم الباكت لازم يطابق بالظبط اسم الـ R2 bucket الموجود في حساب Cloudflare بتاعك
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "farah"

# متغيرات عامة (غير سرية)
[vars]
# رابط "Public Development URL" بتاع الباكت (من صفحة الباكت في Cloudflare Dashboard)
# لو حطيت دومين مخصص (custom domain) على الباكت بعدين، غيّر الرابط ده بيه
PUBLIC_R2_URL = "https://pub-67b746453495438199c20622c45722a3.r2.dev"

# ملحوظة: مفتاح NVIDIA_API_KEY يُضاف كـ secret عبر:
#   wrangler secret put NVIDIA_API_KEY
